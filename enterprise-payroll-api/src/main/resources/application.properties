# ─────────────────────────────────────────────────────────────
# Enterprise Payroll Platform — Application Configuration
# ─────────────────────────────────────────────────────────────

spring.application.name=enterprise-payroll-api

# ── PostgreSQL Datasource ──────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5433/payroll_db
spring.datasource.username=payroll_admin
spring.datasource.password=changeme
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ── Flyway Migrations ────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JWT Configuration ────────────────────────────────────
# Base64-encoded 256-bit HMAC-SHA secret (replace in production)
app.jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjdXJlLWtleS1mb3ItZGV2LW9ubHktcmVwbGFjZS1pbi1wcm9k
app.jwt.expiration-ms=86400000

# ── Actuator ─────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ── Kafka Configuration ────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payroll-pdf-workers

# ── MinIO Configuration ────────────────────────────────────
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=payroll-payslips

# ── Logging ────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG


